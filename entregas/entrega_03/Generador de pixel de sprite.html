<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--paper:#f2f4f7;--sheet:#fbfcfd;--grid:#e4e8ee;--ink:#1b2231;--muted:#5a6477;--line:#2b3346;--accent:#2c56c9;--on:#d9381e;--sig:#a8296a;--ok:#1d8a3a;

--n-in:#45421f;--n-calc:#2f5225;--n-ram:#5a2d63;--n-q:#625a1a;--n-rom:#22556a;--n-zero:#6a3434;--n-one:#25643a;--n-st:#1b2230;--led-off:#0b0d11;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f141c;--sheet:#141a24;--grid:#1d2533;--ink:#e3e8f1;--muted:#97a3b8;--line:#c5cede;--accent:#7ea4ff;--on:#ff6a4d;--sig:#ff86c2;--ok:#5fd47f;
--n-in:#45421f;--n-calc:#2f5225;--n-ram:#5a2d63;--n-q:#625a1a;--n-rom:#22556a;--n-zero:#6a3434;--n-one:#25643a;--n-st:#1b2230;--led-off:#0b0d11;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}

.sub{margin:2px 0 0;color:var(--muted);font-family:var(--mono);font-size:12.5px}
.scenes{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.scenes button{font:500 12.5px var(--mono);color:var(--muted);background:transparent;border:1px solid var(--grid);border-radius:4px;padding:5px 9px;cursor:pointer}
.scenes button[aria-current="true"]{color:var(--sheet);background:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stagewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--grid);border-radius:6px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#stage{display:block;width:100%;min-width:820px;height:auto}
.panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:start}

.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}

.panel p{margin:0;max-width:68ch}

.ctl button.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.ctl button:disabled{opacity:.4;cursor:default}
.count{font:12.5px var(--mono);color:var(--muted);width:100%}
.sim{display:grid;gap:10px;border-top:1px solid var(--grid);padding-top:14px}
.sim .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.sim label{font:500 13px var(--mono)}
.sim input{width:64px;font:15px var(--mono);padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink)}
.simgrid{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-start}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font:13px var(--mono);min-width:420px}
th,td{text-align:left;padding:4px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
th{color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(8,16px);gap:3px;padding:6px;background:#0b0d11;border-radius:4px;width:max-content}
.cell{width:16px;height:16px;border-radius:50%;background:var(--led-off)}
.cell.on{background:var(--on)}.cell.sel{outline:2px solid #fff;outline-offset:1px}
.hint{font:12.5px var(--mono);color:var(--muted)}
svg text{font-family:var(--sans);font-size:14px;fill:var(--ink)}
svg .mono{font-family:var(--mono)}svg .sm{font-size:12px}svg .xs{font-size:10.5px}svg .b{font-weight:600}
svg .ttl{font-family:var(--cond);font-weight:700;font-size:15px}
svg .lbl{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
svg .ann{font-family:var(--mono);font-size:12px;fill:var(--on);font-weight:600}
.w{fill:none;stroke:var(--line);stroke-width:1.6}
.shape{stroke:var(--line);stroke-width:2}
.n-in .shape{fill:var(--n-in)}.n-calc .shape{fill:var(--n-calc)}.n-ram .shape{fill:var(--n-ram)}.n-q .shape{fill:var(--n-q)}.n-rom .shape{fill:var(--n-rom)}.n-zero .shape{fill:var(--n-zero)}.n-one .shape{fill:var(--n-one)}.n-st .shape{fill:var(--n-st)}
.node.hl .shape{stroke:var(--accent);stroke-width:4}
.ahp{fill:var(--line)}
.el{opacity:0;transition:opacity .55s ease}.el.on{opacity:1}
.cellr{fill:var(--sheet);stroke:var(--line);stroke-width:1}
.cellr.sel{fill:color-mix(in srgb,var(--accent) 30%,var(--sheet));stroke:var(--accent);stroke-width:3}
.dot{fill:var(--ink)}.dot.off{fill:none;stroke:var(--grid)}
.stripe{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent);stroke-width:1.5}
.ring{fill:none;stroke:var(--on);stroke-width:3}
@media (prefers-reduced-motion:reduce){.el{transition:none}}

<div class="wrap">
<header><div><h1>Generador de pixel de sprite</h1>
<p class="sub">Coordenadas (col, row) → celda 8×8 → RAM de sprites → ROM de sprite → Color_out</p></div>
<ul class="scenes" id="scenes"></ul></header>

<div class="stagewrap">
<svg id="stage" viewBox="0 0 1200 700" role="img" aria-label="Diagrama de flujo del generador de pixel de sprite y su ejemplo con celdas 8×8">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="ahp" d="M0,0 L10,5 L0,10z"/></marker></defs>
<g>

<path class="w" d="M250,104 V122" marker-end="url(#ah)"/>
<path class="w" d="M250,172 V190" marker-end="url(#ah)"/>
<path class="w" d="M250,240 V258" marker-end="url(#ah)"/>
<path class="w" d="M250,318 V340" marker-end="url(#ah)"/><text x="260" y="334" class="sm">no</text>
<path class="w" d="M250,390 V408" marker-end="url(#ah)"/>
<path class="w" d="M250,458 V476" marker-end="url(#ah)"/>
<path class="w" d="M250,526 V544" marker-end="url(#ah)"/>
<path class="w" d="M250,604 V626" marker-end="url(#ah)"/><text x="260" y="620" class="sm">no</text>
<path class="w" d="M120,288 H58 V206" marker-end="url(#ah)"/><text x="82" y="280" class="sm">sí</text>
<path class="w" d="M120,574 H28 V206" marker-end="url(#ah)"/><text x="62" y="566" class="sm">sí</text>
<path class="w" d="M58,150 V82 H118" marker-end="url(#ah)"/>
<g class="node n-st" id="n-start"><rect class="shape" x="190" y="10" width="120" height="34" rx="17"/><text x="250" y="32" text-anchor="middle">Inicio</text></g>
<g class="node n-in" id="n-in"><rect class="shape" x="120" y="60" width="260" height="44" rx="3"/><text x="250" y="78" text-anchor="middle" class="sm b">Recibe coordenadas</text><text x="250" y="95" text-anchor="middle" class="mono sm">col y Row</text></g>

<g class="node n-ram" id="n-ram"><rect class="shape" x="120" y="190" width="260" height="50" rx="3"/><text x="250" y="209" text-anchor="middle" class="sm b">Lee la RAM de sprites</text><text x="250" y="228" text-anchor="middle" class="mono xs">Sprite_ID = RAM[ram_addr]</text></g>
<g class="node n-q" id="n-q1"><polygon class="shape" points="250,258 380,288 250,318 120,288"/><text x="250" y="285" text-anchor="middle" class="xs">¿Sprite vacío?</text><text x="250" y="299" text-anchor="middle" class="mono xs">Sprite_ID == 0</text></g>

<g class="node n-rom" id="n-col"><rect class="shape" x="120" y="476" width="260" height="50" rx="3"/><text x="250" y="495" text-anchor="middle" class="sm b">Color de pixel asignado</text><text x="250" y="514" text-anchor="middle" class="mono xs">Color_pixel = Sprite_row[Col[2:0]]</text></g>
<g class="node n-q" id="n-q2"><polygon class="shape" points="250,544 380,574 250,604 120,574"/><text x="250" y="571" text-anchor="middle" class="xs">¿Es color</text><text x="250" y="585" text-anchor="middle" class="xs">transparente?</text></g>

</g>
<g transform="translate(520,0)">

<text x="20" y="330" class="lbl">pantalla 64×64 px = 8×8 celdas</text></g>
<g id="c0" class="el"><text x="20" y="352" class="ann">entrada (3, 2) → celda (0, 0)</text></g>
<g id="g2" class="el"><g id="ids" transform="translate(20,70)"></g><text x="20" y="376" class="mono sm">ram_addr = {0, 0} = 0 → Sprite_ID = 1</text><text x="20" y="396" class="lbl">RAM definida por el usuario · 0 = celda vacía</text></g>
<g id="g3" class="el"><text x="320" y="34" class="ttl">ROM de sprite · sprite 1 (corazón)</text><text x="320" y="54" class="lbl">8×8 pixeles · cada pixel = RGB de 3 bits</text><g id="glyph" transform="translate(354,70)"></g>
<text x="320" y="340" class="mono sm">Row_addr = {1, Row[2:0]} = 1·8 + 2 = 10</text></g>
<g id="g4" class="el"><circle class="ring" id="ringc" r="14"/><text x="320" y="362" class="ann">Col[2:0] = 3 → Color_pixel = 100 (rojo)</text></g>
<g id="g5" class="el"><rect class="shape" x="320" y="384" width="190" height="52" rx="3" style="fill:var(--n-one)"/><text x="415" y="407" text-anchor="middle" class="sm b">No transparente</text><text x="415" y="425" text-anchor="middle" class="sm">Sprite = 1 · Color_out</text>
<rect class="shape" x="530" y="384" width="190" height="52" rx="3" style="fill:var(--n-zero)"/><text x="625" y="407" text-anchor="middle" class="sm b">Transparente (000)</text><text x="625" y="425" text-anchor="middle" class="sm">Sprite = 0 · no pinta</text>
<rect x="326" y="446" width="22" height="22" rx="3" fill="#d9381e" stroke="var(--line)"/><text x="356" y="462" class="mono sm">Color_out = 100</text></g>
</g>
</svg></div>

<section class="panel"><div><p class="eyebrow" id="eb"></p><h2 id="tt"></h2><p id="dd"></p></div>
<div class="ctl"><button id="prev">Anterior</button><button id="next" class="primary">Siguiente</button><button id="play">Reproducir</button><span class="count" id="cnt"></span></div></section>

<section class="sim"><p class="eyebrow">Simulación</p>
<div class="row"><label>col (0–63) <input id="ic" type="number" min="0" max="63" value="3"></label><label>row (0–63) <input id="ir" type="number" min="0" max="63" value="2"></label><label>Sprite_ID de esa celda (0–2) <input id="is" type="number" min="0" max="2" value="1"></label>
<span class="hint">RAM de ejemplo: (0,0)=1 corazón, (1,0)=2 cara, (2,1)=1. Edita el ID para probar tu propia RAM.</span></div>
<div class="simgrid"><div class="tablewrap"><table><thead><tr><th>Paso</th><th>Valor</th></tr></thead><tbody id="tb"></tbody></table></div>
<figure style="margin:0;display:grid;gap:6px"><div class="grid" id="sg"></div><figcaption class="hint" id="sc"></figcaption></figure></div></section>
</div>
<script>
(function(){
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const PAL=['#20242c','#2c56c9','#2fa84f','#2fb8c9','#d9381e','#c43fc4','#f0d020','#ffffff'],NM=['transparente','azul','verde','cian','rojo','magenta','amarillo','blanco'];
const SP={1:['00000000','04400440','47444444','44444444','04444440','00444400','00044000','00000000'],
2:['00666600','06666660','66166166','66666666','61666616','06111160','00666600','00000000']};
const RAM0={0:1,1:2,10:1},RAM={...RAM0};
const ex=(t,a,s)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(s!=null)e.textContent=s;return e};

const GL=$('glyph'),S=26;SP[1].forEach((row,r)=>{GL.appendChild(ex('text',{x:-8,y:r*S+S/2+4,'text-anchor':'end',class:'lbl'},r));for(let c=0;c<8;c++){const k=+row[c];GL.appendChild(ex('circle',{cx:c*S+S/2,cy:r*S+S/2,r:8,fill:k?PAL[k]:'none',stroke:k?'none':'var(--grid)'}))}});
for(let c=0;c<8;c++)GL.appendChild(ex('text',{x:c*S+S/2,y:8*S+14,'text-anchor':'middle',class:'lbl'},c));

$('ringc').setAttribute('transform','translate(354,70) translate('+(3*S+S/2)+','+(2*S+S/2)+')');
const SC=['Algoritmo','Celdas 8×8','RAM de sprites','ROM de sprite','Resultado'];
const ALL=['g1','c0','g2','g3','g4','g5'],ST=[
{sc:0,t:'El algoritmo',d:'Para cada pixel (col, row) el módulo decide si hay un sprite encima. Localiza la celda de 8×8, consulta en una RAM qué sprite hay en ella, toma el color del pixel desde la ROM de sprite y, si no es transparente, lo entrega como Color_out. Si la celda está vacía o el color es transparente, no pinta nada (Sprite = 0).',hl:[],show:[]},
{sc:1,t:'Primero: dividir en celdas de 8×8',d:'La pantalla de 64×64 pixeles se divide en una cuadrícula de 8×8 celdas. Cada celda puede alojar un sprite de 8×8 pixeles. Los bits altos Row[5:3] y Col[5:3] identifican la celda.',hl:['n-in','n-addr'],show:['g1']},
{sc:1,t:'Segundo: asignar celda',d:'La coordenada de entrada (3, 2) cae en la celda (0, 0). Dentro de la celda quedan los bits bajos: Col[2:0] = 3 y Row[2:0] = 2. La dirección de la celda es ram_addr = {Row[5:3], Col[5:3]} = 0.',hl:['n-in','n-addr'],show:['g1','c0']},
{sc:2,t:'Tercero: leer la RAM de sprites',d:'La RAM la define el usuario: guarda un Sprite_ID por celda, sin librería fija. En la celda (0, 0) hay el sprite 1. Si Sprite_ID == 0, la celda está vacía: Sprite = 0 y el flujo vuelve a recibir coordenadas.',hl:['n-ram','n-q1'],show:['g1','c0','g2']},
{sc:3,t:'Determinar el sprite en la ROM',d:'Row_addr = {Sprite_ID, Row[2:0]}: el ID elige el sprite en la ROM y Row[2:0] elige una de sus 8 filas (aquí la fila 2). Cada fila contiene 8 pixeles con color RGB.',hl:['n-rom','n-rd'],show:['g1','c0','g2','g3']},
{sc:3,t:'Color del pixel asignado',d:'De Sprite_row se toma el pixel que corresponde a Col[2:0]. Aquí la columna 3 de la fila 2 es rojo (100).',hl:['n-col'],show:['g1','c0','g2','g3','g4']},
{sc:4,t:'¿Es color transparente?',d:'Si el color es transparente (000), Sprite = 0 y no se pinta nada. Si no lo es, Sprite = 1 y Color_out = Color_pixel. En el ejemplo (3, 2) el rojo no es transparente, así que el pixel se dibuja.',hl:['n-q2','n-one','n-zero'],show:['g1','c0','g2','g3','g4','g5']}];
let i=0,tm=null;
SC.forEach((n,k)=>{const li=document.createElement('li'),b=document.createElement('button');b.textContent=(k+1)+'. '+n;b.onclick=()=>{stop();go(ST.findIndex(s=>s.sc===k))};li.appendChild(b);$('scenes').appendChild(li)});
function go(n){i=Math.max(0,Math.min(ST.length-1,n));const s=ST[i];
ALL.forEach(d=>$(d).classList.toggle('on',s.show.includes(d)));
document.querySelectorAll('.node').forEach(e=>e.classList.toggle('hl',s.hl.includes(e.id)));
$('eb').textContent='Escena '+(s.sc+1)+' · '+SC[s.sc];$('tt').textContent=s.t;$('dd').textContent=s.d;
$('cnt').textContent='Paso '+(i+1)+' de '+ST.length;$('prev').disabled=!i;$('next').disabled=i===ST.length-1;
document.querySelectorAll('#scenes button').forEach((b,k)=>b.setAttribute('aria-current',k===s.sc))}
$('prev').onclick=()=>{stop();go(i-1)};$('next').onclick=()=>{stop();go(i+1)};
function stop(){if(tm){clearInterval(tm);tm=null;$('play').textContent='Reproducir'}}
$('play').onclick=()=>{if(tm)return stop();if(i===ST.length-1)go(0);$('play').textContent='Pausar';tm=setInterval(()=>{if(i>=ST.length-1)return stop();go(i+1)},3200)};
const sg=$('sg');for(let k=0;k<64;k++){const d=document.createElement('div');d.className='cell';sg.appendChild(d)}

function sim(){const{c,r,ra}=pos(),id=RAM[ra]||0,cells=sg.children;
const rows=[['Entrada (col, row)','('+c+', '+r+')'],['Celda (Row[5:3], Col[5:3])','('+(r>>3)+', '+(c>>3)+')'],['ram_addr','{'+(r>>3)+', '+(c>>3)+'} = '+ra],['Sprite_ID',id]];
let spr=0,out='—';[...cells].forEach(e=>{e.className='cell';e.style.background=''});
if(!id)rows.push(['¿Sprite vacío?','sí → Sprite = 0']);else{
